name: Proves

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  proves:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Configura Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Suite del motor (test_smoke.py)
        run: python test_smoke.py

      - name: Suite del terreny (_test_terreny.py)
        run: python _test_terreny.py

      - name: Fumigacio del bucle complet (mode demo)
        run: python main.py --demo
